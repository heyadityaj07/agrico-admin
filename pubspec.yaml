# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # Codegen emits the UIScene lifecycle itself where it is safe (see
  # useUISceneLifecycle). Flutter's migrator would also rewrite the legacy
  # AppDelegate that every other build still needs.
  config:
    # Flutter uses Swift Package Manager for compatible plugins and CocoaPods
    # for the rest. Projects using the managed Firebase Analytics/GenUI graph
    # stay CocoaPods-only so privacy behavior and wrapper versions are stable.
    enable-swift-package-manager: false
    enable-uiscene-migration: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

  fonts:
    - family: 'Satoshi'
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Italic.otf
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic

    - family: DashBoardcustom
      fonts:
        - asset: assets/fonts/DashBoardcustom.ttf
    - family: Subscustom
      fonts:
        - asset: assets/fonts/subscustom.ttf
    - family: Home
      fonts:
        - asset: assets/fonts/home.ttf
    - family: Mangeorder
      fonts:
        - asset: assets/fonts/mangeorder.ttf
    - family: ProductAd
      fonts:
